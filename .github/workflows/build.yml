name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: dotnet build ClockStudio.csproj -c Release -o out
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/ClockStudio.exe,out/ClockStudio.exe.config -DestinationPath ClockStudio.zip -ErrorAction SilentlyContinue
          if (!(Test-Path ClockStudio.zip)) { Compress-Archive -Path out/ClockStudio.exe -DestinationPath ClockStudio.zip }
      - uses: actions/upload-artifact@v4
        with:
          name: ClockStudio
          path: |
            out/ClockStudio.exe
            ClockStudio.zip
      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ClockStudio (latest build)
          files: |
            out/ClockStudio.exe
            ClockStudio.zip
